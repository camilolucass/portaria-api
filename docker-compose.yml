# docker compose up      -> banco e aplicacao, tudo de pe em http://localhost:8080
# docker compose up db   -> so o Postgres, para rodar a aplicacao pela IDE
# docker compose --profile tools up pgadmin
#                        -> pgAdmin em http://localhost:5050, para ver as tabelas
#
# Os segredos vem do arquivo .env, que o Compose le sozinho. Nao ha valor
# padrao: a sintaxe :? faz o Compose parar com uma mensagem util quando falta,
# em vez de subir com um segredo previsivel.

services:
  db:
    image: postgres:16-alpine
    container_name: portaria-db
    environment:
      POSTGRES_DB: portaria
      POSTGRES_USER: portaria
      POSTGRES_PASSWORD: portaria
      TZ: America/Sao_Paulo
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portaria -d portaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: portaria-app
    depends_on:
      # espera o banco aceitar conexao: o Flyway migra no boot e falharia
      # contra um Postgres que ainda esta inicializando
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/portaria
      DB_USER: portaria
      DB_PASSWORD: portaria
      # perfil dev: cria o evento de demonstracao e as contas de cada papel,
      # para a interface ter o que mostrar sem preparo manual
      SPRING_PROFILES_ACTIVE: dev
      QR_SECRET: ${QR_SECRET:?defina no .env — copie de .env.example}
      JWT_SECRET: ${JWT_SECRET:?defina no .env — copie de .env.example}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina no .env — copie de .env.example}
    ports: ["8080:8080"]
    restart: unless-stopped

  # Navegador visual do banco, em http://localhost:5050. Fica fora do
  # `docker compose up`: so sobe quando o profile e pedido, com
  #   docker compose --profile tools up pgadmin
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: portaria-pgadmin
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@exemplo.com
      PGADMIN_DEFAULT_PASSWORD: portaria
      # ferramenta local: abre direto no navegador, sem tela de login nem
      # senha mestra. Nao use esta configuracao em rede compartilhada
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      # deixa a conexao com o banco ja cadastrada. Lido apenas na primeira
      # subida, quando o volume pgadmin ainda esta vazio
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin
    ports: ["5050:80"]

volumes:
  pgdata:
  pgadmin:
