name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # segredo de teste, obviamente falso e sem valor nenhum: os Testcontainers
      # sobem um banco descartavel e nenhum QR gerado aqui sai desta maquina.
      # O segredo real vive fora do repositorio, como manda a secao 7.2 do SPEC.
      QR_SECRET: ci-secret-obviamente-falso-com-mais-de-32-caracteres
      JWT_SECRET: ci-jwt-secret-obviamente-falso-com-mais-de-32-caracteres

    steps:
      - uses: actions/checkout@v4

      - name: Configura o JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # os Testcontainers precisam de Docker; o runner do GitHub ja o traz
      - name: Confere o Docker
        run: docker version

      - name: mvn verify
        run: ./mvnw -B verify

      - name: Publica os relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
