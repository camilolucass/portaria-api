spring:
  application:
    name: portaria-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portaria}
    username: ${DB_USER:portaria}
    password: ${DB_PASSWORD:portaria}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false          # obrigatorio: forca o DTO a ser montado no service
  flyway:
    enabled: true

app:
  jwt:
    # sem valor padrao em arquivo versionado, igual ao QR_SECRET (SPEC 7.2)
    secret: ${JWT_SECRET:}
    expiration-minutes: 60
  login:
    # freio de forca bruta. Duas contagens: uma protege a conta, a outra impede
    # varredura de muitos e-mails a partir do mesmo endereco
    max-attempts-per-account: 5
    max-attempts-per-address: 20
    block-duration: 15m
  webhook:
    # segredo compartilhado com o gateway; sem valor padrao versionado
    secret: ${WEBHOOK_SECRET:}
  qr:
    # sem valor padrao em arquivo versionado (SPEC 7.2). Usado a partir da Etapa 4.
    secret: ${QR_SECRET:}
  order:
    expiration-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /docs
