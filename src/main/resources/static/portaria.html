<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portaria — validar entrada</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<header>
    <h1></h1>
    <div style="display:flex;gap:0.8rem;align-items:center">
        <span class="who"></span>
        <button class="ghost" id="logout">Sair</button>
    </div>
</header>

<main>
    <section>
        <h2>Leitor</h2>
        <div id="reader"></div>
        <p class="muted" id="cameraMsg" style="text-align:center"></p>
    </section>

    <section>
        <h2>Codigo manual</h2>
        <p class="muted">Para quando a camera falha — ou para demonstrar sem celular.</p>
        <div class="row">
            <div style="grid-column:1/-1"><input id="manual" placeholder="uuid.assinatura"></div>
        </div>
        <button id="send">Validar</button>
    </section>
</main>

<!-- o retorno ocupa a tela inteira: quem opera portaria olha de relance, com
     fila na frente. Ler texto pequeno nao e opcao. -->
<div id="verdict">
    <div class="icon" id="vIcon"></div>
    <div class="title" id="vTitle"></div>
    <div class="holder" id="vHolder"></div>
    <div class="detail" id="vDetail"></div>
</div>

<script type="module">
    import { api, auth, ApiError, mountHeader } from '/api.js';

    auth.require();
    mountHeader('Portaria');

    const verdict = document.querySelector('#verdict');
    let busy = false;

    function show(kind, icon, title, holder, detail) {
        verdict.className = `show ${kind}`;
        document.querySelector('#vIcon').textContent = icon;
        document.querySelector('#vTitle').textContent = title;
        document.querySelector('#vHolder').textContent = holder || '';
        document.querySelector('#vDetail').textContent = detail || '';
        setTimeout(() => { verdict.className = ''; busy = false; }, 2600);
    }

    async function validate(code) {
        // trava enquanto mostra o resultado: a camera dispara varias leituras
        // por segundo e sem isto a mesma pessoa geraria dezenas de requisicoes
        if (busy || !code) return;
        busy = true;

        try {
            const result = await api.post('/api/v1/checkins', { code });
            show('granted', '✓', 'ENTRADA LIBERADA', result.holderName, result.batchName);
        } catch (error) {
            const title = error instanceof ApiError ? error.title : 'Falha';
            show('denied', '✕', title.toUpperCase(), '', error.message);
        }
    }

    document.querySelector('#send').addEventListener('click', () => {
        const input = document.querySelector('#manual');
        validate(input.value.trim());
        input.value = '';
    });

    /*
     * getUserMedia so funciona em contexto seguro: HTTPS ou localhost. Aberta
     * pelo IP da rede local, a camera e bloqueada pelo navegador — dai a
     * mensagem explicita, em vez de uma tela morta sem explicacao.
     */
    const cameraMsg = document.querySelector('#cameraMsg');
    if (!window.isSecureContext) {
        cameraMsg.textContent =
            'Camera indisponivel: a pagina precisa estar em HTTPS ou localhost. Use o codigo manual.';
    } else {
        const scanner = new Html5Qrcode('reader');
        scanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 240, height: 240 } },
            (text) => validate(text),
            () => { /* quadro sem QR e o caso normal, nao e erro */ },
        ).catch((error) => {
            cameraMsg.textContent = `Nao foi possivel abrir a camera: ${error}. Use o codigo manual.`;
        });
    }
</script>
</body>
</html>
