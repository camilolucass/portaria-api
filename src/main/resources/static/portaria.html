<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Portaria - validar entrada</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<header>
    <h1></h1>
    <div class="session">
        <span class="who"></span>
        <button class="ghost" id="logout">Sair</button>
    </div>
</header>

<main>
    <section>
        <h2>Leitor</h2>
        <div id="reader"></div>
        <p class="muted center" id="cameraMsg"></p>
    </section>

    <section>
        <h2>Codigo manual</h2>
        <div class="field">
            <label for="manual">Codigo do ingresso</label>
            <input id="manual" autocapitalize="none" spellcheck="false"
                   aria-describedby="manualHelp">
            <p class="muted" id="manualHelp">
                Para quando a camera falha, ou para validar sem celular.
            </p>
        </div>
        <button id="send">Validar</button>
    </section>
</main>

<!--
  O retorno ocupa a tela inteira: quem opera olha de relance, de pe, com fila
  na frente. aria-live faz o leitor de tela anunciar o veredito sem que o foco
  precise sair do campo.
-->
<div id="verdict" role="status" aria-live="assertive">
    <div class="icon" id="vIcon" aria-hidden="true"></div>
    <div class="title" id="vTitle"></div>
    <div class="holder" id="vHolder"></div>
    <div class="detail" id="vDetail"></div>
    <button class="ghost dismiss" id="vDismiss">Proximo</button>
</div>

<script type="module">
    import { api, auth, ApiError, mountHeader } from '/api.js';

    auth.require();
    mountHeader('Portaria');

    const verdict = document.querySelector('#verdict');
    const manual = document.querySelector('#manual');
    const HOLD_MS = 2600;

    let busy = false;
    let timer = null;

    function clearVerdict() {
        clearTimeout(timer);
        verdict.className = '';
        busy = false;
        manual.focus();
    }

    function show(kind, icon, title, holder, detail) {
        verdict.className = `show ${kind}`;
        document.querySelector('#vIcon').textContent = icon;
        document.querySelector('#vTitle').textContent = title;
        document.querySelector('#vHolder').textContent = holder || '';
        document.querySelector('#vDetail').textContent = detail || '';

        // some sozinho, mas da para adiantar: numa fila, 2,6s por pessoa e muito
        clearTimeout(timer);
        timer = setTimeout(clearVerdict, HOLD_MS);
    }

    async function validate(code) {
        // trava enquanto o resultado esta na tela: a camera dispara varias
        // leituras por segundo e sem isto uma pessoa geraria dezenas de
        // requisicoes, todas menos a primeira voltando 409
        if (busy || !code) return;
        busy = true;

        try {
            const result = await api.post('/api/v1/checkins', { code });
            show('granted', '✓', 'ENTRADA LIBERADA', result.holderName, result.batchName);
        } catch (error) {
            const title = error instanceof ApiError ? error.title : 'Falha';
            show('denied', '✕', title.toUpperCase(), '', error.message);
        }
    }

    document.querySelector('#vDismiss').addEventListener('click', clearVerdict);
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && verdict.classList.contains('show')) clearVerdict();
    });

    document.querySelector('#send').addEventListener('click', () => {
        validate(manual.value.trim());
        manual.value = '';
    });

    // Enter valida: quem digita codigo nao quer tirar a mao do teclado
    manual.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            validate(manual.value.trim());
            manual.value = '';
        }
    });

    /*
     * getUserMedia so funciona em contexto seguro: HTTPS ou localhost. Aberta
     * pelo IP da rede local, a camera e bloqueada pelo navegador, entao a tela
     * diz isso em vez de mostrar um leitor morto sem explicacao.
     */
    const cameraMsg = document.querySelector('#cameraMsg');
    if (!window.isSecureContext) {
        cameraMsg.textContent =
            'Camera indisponivel: a pagina precisa estar em HTTPS ou localhost. '
            + 'Use o codigo manual abaixo.';
    } else {
        const scanner = new Html5Qrcode('reader');
        scanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 240, height: 240 } },
            (text) => validate(text),
            () => { /* quadro sem QR e o caso normal, nao e erro */ },
        ).catch((error) => {
            cameraMsg.textContent = `Nao foi possivel abrir a camera (${error}). `
                + 'Use o codigo manual abaixo.';
        });
    }
</script>
</body>
</html>
