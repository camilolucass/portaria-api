<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Portaria - entrar</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="login">
    <section>
        <h1 class="brand">Portaria</h1>

        <form id="form" novalidate>
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" type="email" autocomplete="username"
                       autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="field">
                <label for="password">Senha</label>
                <input id="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" id="submit">Entrar</button>
        </form>

        <div id="msg" class="msg" role="alert" hidden></div>
    </section>
</main>

<script type="module">
    import { api, auth, showMessage } from '/api.js';

    const form = document.querySelector('#form');
    const submit = document.querySelector('#submit');
    const msg = document.querySelector('#msg');

    /** Cada papel tem uma tela. Quem acumula papeis cai na mais completa. */
    function destinationFor(roles) {
        if (roles.includes('ORGANIZER')) return '/organizador.html';
        if (roles.includes('GATE')) return '/portaria.html';
        return '/comprador.html';
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        msg.hidden = true;

        // o rotulo troca em vez de virar um circulo girando: o usuario continua
        // sabendo o que o botao estava fazendo
        submit.disabled = true;
        submit.setAttribute('aria-busy', 'true');
        submit.textContent = 'Entrando...';

        try {
            const session = await api.login(
                document.querySelector('#email').value,
                document.querySelector('#password').value);
            auth.save(session.token, session.roles);
            location.replace(destinationFor(session.roles));
        } catch (error) {
            showMessage(msg, error.message);
            submit.disabled = false;
            submit.removeAttribute('aria-busy');
            submit.textContent = 'Entrar';
            document.querySelector('#password').focus();
        }
    });
</script>
</body>
</html>
